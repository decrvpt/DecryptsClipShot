[app]
defaults_version=8
start_only_with_fortnite=1
keep_rejected_clips=1
replay_stable_seconds=15
post_match_seconds=15
minimize_to_tray=0

[recording]
ffmpeg_path=ffmpeg.exe
framerate=30
segment_seconds=30
buffer_seconds=180
clip_seconds=90
capture_backend=auto
video_encoder=libx264
video_options=-preset veryfast -crf 20 -pix_fmt yuv420p
encoder_preset=balanced
output_height=1080
prioritize_game=1
audio_helper_path=ClipShotAudio.exe
capture_game_audio=1
game_audio_device=Default Windows output
av_sync_offset_ms=0
game_audio_volume=100
capture_microphone=0
microphone_device=Default microphone
microphone_volume=100

[controls]
manual_clip_hotkey=F8

[folders]
buffer=buffer
; Empty = the Videos folder (Videos\Decrypt's ClipShot)
clips=
work=work

[local_replay]
enabled=1
parser_path=ClipShotReplayParser.exe
